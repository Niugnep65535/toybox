<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <!-- 關鍵：讓手機瀏覽器正確以 1:1 比例縮放 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>多行輸入框</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
    }

    body {
      padding: 16px;
      background-color: #f8f9fa;
    }

    textarea {
      width: 100%;
      height: 100%;
      padding: 16px;
      /* 關鍵：字體設定 >= 16px，可避免 iPhone/iOS 點擊輸入框時畫面被強制放大 */
      font-size: 16px;
      line-height: 1.6;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      outline: none;
      resize: none; /* 手機版通常停用右下角手動縮放把手 */
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-appearance: none; /* 移除 iOS 預設陰影或圓角怪異效果 */
    }

    textarea:focus {
      border-color: #3b82f6;
    }
  </style>
</head>
<body>
  <textarea placeholder="請在此輸入文字..."></textarea>
</body>
</html>
